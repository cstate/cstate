{{ range partial "issues/pinned.html" . }}
  {{ $severity := cond (.Params.informational | default false) "informational" (.Params.severity | default "notice") }}
  <div class="announcement-box announcement-box--{{ $severity | urlize }}" data-announcement-severity="{{ $severity }}">
      <div class="padding announcement-item">
        <p>
          <a href="{{ .RelPermalink }}" class="announcement-link"><strong class="bold">{{ .Title }} →</strong></a>
        </p>

        <p><small>
          {{ range .Params.Affected }}
              
          <a href="{{ printf "affected/%s/" (. | urlize) | relURL }}" class="tag no-underline">{{ . }}</a>
          
          {{ end }}
        </small></p>

        {{ .Content | safeHTML | truncate 500 "…" }}
        <p></p>
      </div>

  </div>
{{ end }}
