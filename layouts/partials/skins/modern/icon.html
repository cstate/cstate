{{- $name := .name -}}
{{- $class := .class | default "modern-icon" -}}
{{- $label := .label | default "" -}}
<svg class="{{ $class }}" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" {{ if $label }}role="img" aria-label="{{ $label }}"{{ else }}aria-hidden="true" focusable="false"{{ end }}>
  {{- if eq $name "alert-circle" -}}
    <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>
  {{- else if eq $name "arrow-up" -}}
    <path d="m18 15-6-6-6 6"></path>
  {{- else if eq $name "atom" -}}
    <circle cx="12" cy="12" r="1"></circle><path d="M20.2 20.2c2-2 .4-6.8-3.6-10.8S7.8 3.8 5.8 5.8s-.4 6.8 3.6 10.8 8.8 5.6 10.8 3.6Z"></path><path d="M15 9c-4 4-5.6 8.8-3.6 10.8s6.8.4 10.8-3.6S27.8 7.4 25.8 5.4 19 5 15 9Z" transform="translate(-6)"></path>
	  {{- else if eq $name "bell" -}}
	    <path d="M10 21h4"></path><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path>
	  {{- else if eq $name "calendar" -}}
	    <path d="M8 2v4"></path><path d="M16 2v4"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18"></path>
	  {{- else if eq $name "flask" -}}
	    <path d="M9 3h6"></path><path d="M10 3v6.2L4.3 19a2 2 0 0 0 1.7 3h12a2 2 0 0 0 1.7-3L14 9.2V3"></path><path d="M6.7 16h10.6"></path>
	  {{- else if eq $name "check-circle" -}}
	    <path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"></path><path d="m9 11 3 3L22 4"></path>
  {{- else if eq $name "chevron-down" -}}
    <path d="m6 9 6 6 6-6"></path>
  {{- else if eq $name "chevron-right" -}}
    <path d="m9 18 6-6-6-6"></path>
	  {{- else if eq $name "clock" -}}
	    <circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path>
	  {{- else if eq $name "download" -}}
	    <path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path>
  {{- else if eq $name "external-link" -}}
    <path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
  {{- else if eq $name "history" -}}
    <path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 3v6h6"></path><path d="M12 7v5l3 2"></path>
  {{- else if eq $name "info" -}}
    <circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path>
  {{- else if eq $name "rss" -}}
    <path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle>
  {{- else if eq $name "x-circle" -}}
    <circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path>
  {{- else -}}
    <circle cx="12" cy="12" r="10"></circle>
  {{- end -}}
</svg>
