name: Release checks

on:
  pull_request:
    branches:
      - master
      - v7
  push:
    branches:
      - master
      - v7

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        hugo: ['0.158.0', '0.167.0']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ matrix.hugo }}
          extended: true

      - name: Build example site
        run: |
          rm -rf /tmp/cstate-v7-build
          hugo \
            --source exampleSite \
            --themesDir ../.. \
            --theme cstate \
            --destination /tmp/cstate-v7-build \
            --cleanDestinationDir \
            --printPathWarnings \
            --printI18nWarnings

      - name: Verify generated records and URLs
        run: CSTATE_BUILD_DIR=/tmp/cstate-v7-build node scripts/verify-record-sections.mjs

      - name: Verify v7 API contract
        run: CSTATE_BUILD_DIR=/tmp/cstate-v7-build node scripts/verify-v7-contract.mjs

      - name: Verify issue regressions and reporting
        run: |
          node scripts/verify-bugfixes.mjs
          node scripts/verify-status-tool.mjs
          node scripts/verify-v7-features.mjs
          node scripts/verify-release-policy.mjs

      - name: Verify inferred Decap record metadata
        run: |
          admin_tools="$RUNNER_TEMP/cstate-admin-test"
          npm install --prefix "$admin_tools" --no-save --ignore-scripts --no-package-lock js-yaml@4.3.2 smol-toml@1.9.1
          CSTATE_ADMIN_TEST_MODULES="$admin_tools" node scripts/verify-admin-records.mjs

      - name: Verify browser history, dates, and real Decap editing
        run: |
          browser_tools="$RUNNER_TEMP/cstate-browser-tools"
          npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.62.1
          "$browser_tools/node_modules/.bin/playwright" install --with-deps chromium webkit
          CSTATE_PLAYWRIGHT_MODULE="$browser_tools/node_modules/playwright" node scripts/verify-v7-review.mjs
          CSTATE_PLAYWRIGHT_MODULE="$browser_tools/node_modules/playwright" node scripts/verify-v7-timestamps.mjs
          curl -fsSL --retry 3 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js' -o "$RUNNER_TEMP/decap-cms.js"
          CSTATE_PLAYWRIGHT_MODULE="$browser_tools/node_modules/playwright" \
            CSTATE_ADMIN_TEST_MODULES="$RUNNER_TEMP/cstate-admin-test" \
            CSTATE_ADMIN_CMS_BUNDLE="$RUNNER_TEMP/decap-cms.js" \
            CSTATE_ADMIN_YAML_BROWSER="$RUNNER_TEMP/cstate-admin-test/node_modules/js-yaml/dist/js-yaml.min.js" \
            node scripts/verify-admin-browser.mjs
