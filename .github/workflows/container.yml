name: Container images

on:
  push:
    branches: [v7]
  pull_request:
    branches: [v7]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v7.') || startsWith(github.event.release.tag_name, '7.') || startsWith(github.event.release.tag_name, 'v7-r') || startsWith(github.event.release.tag_name, '7-r')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the platform image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: cstate:verify-${{ matrix.arch }}
      - name: Verify startup, persistence, base paths, and failed builds
        run: node scripts/verify-container.mjs cstate:verify-${{ matrix.arch }} linux/${{ matrix.arch }}
      - name: Export downloadable image and checksum
        run: |
          mkdir -p dist
          docker save cstate:verify-${{ matrix.arch }} | gzip > dist/cstate-linux-${{ matrix.arch }}.tar.gz
          cd dist
          sha256sum cstate-linux-${{ matrix.arch }}.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cstate-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  image:
    needs: smoke
    if: github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'v7.') || startsWith(github.event.release.tag_name, '7.') || startsWith(github.event.release.tag_name, 'v7-r') || startsWith(github.event.release.tag_name, '7-r'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Select version tags and protect stable aliases
        id: version
        run: node scripts/container-release-policy.mjs
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: ${{ steps.version.outputs.tags }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
