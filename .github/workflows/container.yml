name: Container images

on:
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'docker/**', '.github/workflows/container.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and serve the bundled site
        run: |
          docker build -t cstate:test .
          docker run -d --name cstate-test -p 8080:80 cstate:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/index.json -o /tmp/index.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; data=json.load(open("/tmp/index.json")); assert data["cStateVersion"] == "7.0"'
          docker logs cstate-test

  image:
    needs: smoke
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v7.') || startsWith(github.event.release.tag_name, '7.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=preview,enable=${{ github.event_name != 'release' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
